<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>microCT Segmentation Lab</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"></div>
      <div><h1>microCT Lab</h1><small>segmentation registry</small></div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/overview" data-view="overview"><span class="ic">◧</span> Overview</a>
