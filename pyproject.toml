[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microct-seg-lab"
version = "0.1.0"
description = "Self-hosted dashboard to catalog microCT datasets, run nnU-Net segmentation, and visualize results (NiiVue)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "numpy>=1.24",
    "SimpleITK>=2.3",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Install this extra on the machine that actually runs segmentation (the GPU box):
#   pip install -e ".[seg]"
# For a CUDA build of torch, install torch first from the pytorch.org index, then this.
seg = ["nnunetv2>=2.2", "torch>=2.0", "natsort>=8"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
microct-web = "microct_lab.cli:web"
microct-worker = "microct_lab.cli:worker"
microct-ingest = "microct_lab.cli:ingest_cli"
microct-register-model = "microct_lab.cli:register_model_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microct_lab = ["web/*", "web/**/*"]
